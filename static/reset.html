<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Atualizando o Aero Jussa…</title>
  <style>
    body{background:#070d18;color:#e7f0fb;font-family:system-ui,Segoe UI,sans-serif;
      min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    h1{color:#1fd8e6;font-weight:700;letter-spacing:.06em;margin:0 0 10px}
    p{color:#c3d3e6;font-size:15px;line-height:1.6;margin:6px 0}
    .ok{color:#5ef08a}
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7055237765703978" crossorigin="anonymous"></script>
</head>
<body>
  <div>
    <h1>JUSSA AERO</h1>
    <p id="msg">Limpando cache e desinstalando a versão antiga…</p>
    <p id="detail" style="font-size:12px;color:#6f87a8"></p>
  </div>
  <script>
    (async function () {
      var d = document.getElementById("detail");
      var n = 0;
      try {
        if ("serviceWorker" in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < regs.length; i++) { await regs[i].unregister(); n++; }
        }
      } catch (e) {}
      try {
        if (window.caches) {
          var keys = await caches.keys();
          for (var j = 0; j < keys.length; j++) { await caches.delete(keys[j]); }
          d.textContent = keys.length + " cache(s) e " + n + " service worker(s) removidos.";
        }
      } catch (e) {}
      document.getElementById("msg").innerHTML = '<span class="ok">Pronto!</span> Abrindo a versão nova…';
      // ?fresh=… força a navegação a ir à rede (sem SW controlando agora).
      setTimeout(function () { location.replace("/?fresh=" + Date.now()); }, 1100);
    })();
  </script>
</body>
</html>
